name: flota

services:

  # ── 1. Base de datos MariaDB ──────────────────────────────
  mariadb:
    image: mariadb:latest
    container_name: mariadb-flota
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - mariadb_data:/var/lib/mysql
    restart: unless-stopped
    networks:
      - flota-network
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── 2. MinIO (Object Storage) ─────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: minio-flota
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000" # API S3
      - "9001:9001" # Consola web
    restart: unless-stopped
    networks:
      - flota-network
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── 3. Backend Flota API (puerto 8001) ────────────────────
  flota-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: flota-api
    restart: always
    environment:
      - DATABASE_URL=mysql+pymysql://${MYSQL_ROOT_USER}:${MYSQL_ROOT_PASSWORD}@mariadb-flota:3306/${MYSQL_DATABASE}?charset=utf8mb4
      - S3_ENDPOINT=http://minio-flota:9000
      - S3_EXTERNAL_ENDPOINT=${S3_EXTERNAL_ENDPOINT}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - INGESTION_API_URL=http://ai:8003
      - OIDC_DISCOVERY_URL=${OIDC_DISCOVERY_URL}
    depends_on:
      mariadb:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - flota-network
      - authentik-network

  # ── 4. AI OCR / Ingestion (puerto 8003) ───────────────────
  ai:
    build:
      context: ./ai
      dockerfile: Dockerfile
    container_name: ai
    restart: always
    environment:
      - LANGSMITH_API_KEY=${LANGSMITH_API_KEY}
      - LANGSMITH_TRACING=${LANGSMITH_TRACING:-true}
      - LANGSMITH_PROJECT=${LANGSMITH_PROJECT:-lock_flota}
      - LANGCHAIN_TRACING_V2=${LANGCHAIN_TRACING_V2:-true}
      - LANGCHAIN_API_KEY=${LANGSMITH_API_KEY}
      - LANGCHAIN_PROJECT=${LANGSMITH_PROJECT:-lock_flota}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DATABASE_URL=mysql+pymysql://${MYSQL_ROOT_USER}:${MYSQL_ROOT_PASSWORD}@mariadb-flota:3306/${MYSQL_DATABASE}?charset=utf8mb4
      - S3_ENDPOINT=http://minio-flota:9000
      - S3_EXTERNAL_ENDPOINT=${S3_EXTERNAL_ENDPOINT}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - INGESTION_API_URL=http://flota-api:8001
      - OIDC_DISCOVERY_URL=${OIDC_DISCOVERY_URL}
    depends_on:
      mariadb:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - flota-network
      - authentik-network

  sol-api:
    build:
      context: ./sol_api_sim
      dockerfile: Dockerfile
    container_name: sol-api
    restart: unless-stopped
    environment:
      - OIDC_DISCOVERY_URL=${OIDC_DISCOVERY_URL}
    volumes:
      - ./sol_api_sim/docs:/app/docs
    networks:
      - flota-network
      - authentik-network

  # ── 6. Frontend Flota (Nginx en puerto 80) ────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_AUTHENTIK_AUTHORITY: ${VITE_AUTHENTIK_AUTHORITY}
        VITE_AUTHENTIK_CLIENT_ID: ${VITE_AUTHENTIK_CLIENT_ID}
        VITE_AUTHENTIK_REDIRECT_URI: ${VITE_AUTHENTIK_REDIRECT_URI}
    container_name: frontend-flota
    ports:
      - "8001:80"
    restart: unless-stopped
    depends_on:
      - flota-api
      - ai
      - sol-api
    networks:
      - flota-network
      - authentik-network

# ── Volúmenes persistentes ────────────────────────────────────
volumes:
  mariadb_data:
  minio_data:

    # ── Red compartida ────────────────────────────────────────────
networks:
  flota-network:
    driver: bridge
  authentik-network:
    external: true
    name: authentik_default
