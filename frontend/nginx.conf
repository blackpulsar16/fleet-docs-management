server {
    listen 80;
    server_name localhost;
    client_max_body_size 100M;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;
    gzip_disable "MSIE [1-6]\.";

    # ── fleet-api → backend-api-1:8001 ───────────────────────────────────────
    location /fleet {
        proxy_pass       http://flota-api:8001/fleet;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering  off;
        proxy_cache      off;
        proxy_read_timeout 3600s;
    }

    location /vehicles/ {
        proxy_pass       http://flota-api:8001/vehicles/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering  off;
        proxy_cache      off;
        proxy_read_timeout 3600s;
    }

    location /documents/ {
        proxy_pass       http://flota-api:8001/documents/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering  off;
        proxy_cache      off;
        proxy_read_timeout 3600s;
    }

    location /ingest-documents {
        proxy_pass       http://flota-api:8001/ingest-documents;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering  off;
        proxy_cache      off;
        proxy_read_timeout 3600s;
    }

    # ── sol-api → sol_api_sim:8002 ────────────────────────────────────────────
    location /sol/ {
        proxy_pass       http://sol-api:8002/sol/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering  off;
        proxy_cache      off;
        proxy_read_timeout 60s;
    }

    # ── ai-ocr → ai-ai-ocr-1:8003  (SSE streaming) ───────────────────────────
    location /ai/ {
        proxy_pass       http://ai:8003/ai/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering  off;
        proxy_cache      off;
        proxy_read_timeout 3600s;
    }

    # ── SPA fallback ──────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2|woff|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }
}
